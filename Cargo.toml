[package]
name = "crm-light"
version = "0.1.0"
edition = "2024"
default-run = "crm-light"

[lib]
name = "crm_light"
path = "src/lib.rs"

[[bin]]
name = "crm-light"
path = "src/main.rs"

# Schema-management CLI. Off by default so the normal build stays lean:
#   cargo run --features cli --bin crm-light-cli -- migration generate
[[bin]]
name = "crm-light-cli"
path = "src/cli.rs"
required-features = ["cli"]

[features]
cli = ["dep:toasty-cli"]

[dependencies]
topcoat = "0.8.1"
# SQLite stays available so the test suite and the migration CLI can run
# without a database server; the server itself targets PostgreSQL.
toasty = { version = "0.10.0", features = ["sqlite", "postgresql", "migration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Auth: password hashing, session/CSRF token randomness and digests, TOTP.
argon2 = "0.5.3"
base64 = "0.22"
hmac = "0.12"
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"

# Timezone-aware formatting, backed by the IANA database.
jiff = "0.2"

# The error type Topcoat's `internal_server_error` accepts for a failure that
# has no better representation. Also used by the migration CLI.
anyhow = "1"

# Transliterates a workspace name to an ASCII sign-in slug, so `Müller GmbH`
# becomes `muller-gmbh` rather than a mangled fragment.
deunicode = "1.6"

toasty-cli = { version = "0.10.0", optional = true }
