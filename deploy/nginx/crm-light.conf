# crm-light behind nginx, over TLS.
#
# Install as /etc/nginx/sites-available/crm-light and enable it:
#
#     sudo cp deploy/nginx/crm-light.conf /etc/nginx/sites-available/crm-light
#     sudo ln -s /etc/nginx/sites-available/crm-light /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d crm.example.com
#
# certbot rewrites the `listen` and `ssl_certificate` lines below to point at
# Let's Encrypt and adds the renewal hook. Replace crm.example.com with your
# domain first, or certbot will ask for the wrong certificate.
#
# The app itself binds 127.0.0.1 only, so this proxy is the sole way in. That is
# what makes TLS, the headers below, and any rate limiting you add here
# enforceable rather than advisory: there is no second door on the app's port.

upstream crm_light {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Rate limiting for the sign-in form, which is the only unauthenticated write on
# the whole site. 10 requests a minute per address, with a small burst, is far
# above what a person needs and far below what a password-guessing script wants.
# The app has its own per-account lockout as well; this is the cheaper first
# line, and it is the one that does not touch the database.
limit_req_zone $binary_remote_addr zone=crm_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # Everything is HTTPS. certbot keeps this block for the renewal challenge
    # and turns the rest into a redirect; leaving it here means the redirect is
    # there before the certificate is.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.example.com;

    # certbot manages these once it has run.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Modern defaults. Ubuntu 22.04's nginx understands these; on a much older
    # one, drop `ssl_conf_command` rather than guessing at a cipher list.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. Only add this once you are sure the certificate renews unattended:
    # browsers cache it, and if TLS breaks, so does the site until it expires.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The app sends `nosniff`, `X-Frame-Options`, and `Referrer-Policy` itself,
    # so they are not repeated here.
    add_header X-Forwarded-Proto $scheme;

    # Nothing this app serves is bigger than a form post.
    client_max_body_size 1m;

    access_log /var/log/nginx/crm-light.access.log;
    error_log  /var/log/nginx/crm-light.error.log;

    location = /login {
        limit_req zone=crm_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://crm_light;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        # The app reads this to record a session's address, and to know it is
        # behind TLS. `$proxy_add_x_forwarded_for` appends rather than replaces,
        # so a client cannot forge the left-most entry.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://crm_light;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app compresses its own responses; compressing them twice is wasted
        # CPU and can make them larger.
        proxy_set_header Accept-Encoding "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
